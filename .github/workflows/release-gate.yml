name: Public release gate

on:
  pull_request:
    paths:
      - 'release/**'
      - 'tools/prepare-release.py'
      - 'build/ci/prepare-stable-release.py'
      - 'build/ci/ota_v2_product.py'
      - 'build/ci/target_registry.py'
      - 'build/ci/validate-targets.py'
      - 'build/ci/validate-stable-publisher.py'
      - 'build/ci/publish-stable-release.sh'
      - 'build/ci/generate-release-notes.py'
      - 'build/tests/test_release_packaging.py'
      - 'build/tests/test_ota_v2_complete_gate.py'
      - 'build/tests/test_multi_target.py'
      - 'build/tests/test_target_manifest.py'
      - 'build/tests/test_generate_release_notes.py'
      - 'tools/prepare-sbom.py'
      - 'tools/check-release-components.py'
      - 'tools/radio_firmware.py'
      - 'tools/test_radio_firmware.py'
      - 'tools/check-public-metadata.py'
      - 'tools/test_release_tools.py'
      - 'tools/libreecho-install.py'
      - 'tools/libreecho-install.py.sha256'
      - 'tools/run-one-shot.sh'
      - 'tools/test_initial_installer_publication.py'
      - 'tools/test_fastbrick_gate.py'
      - 'tools/test_oneshot_host_preflight.py'
      - 'tools/test_installer_setup_reconnect.py'
      - 'build/ci/release_route.py'
      - 'build/ci/publish_dev_pointer.py'
      - 'build/tests/test_release_route.py'
      - 'build/tests/test_publish_dev_pointer.py'
      - 'build/ci/generate-news.py'
      - 'build/tests/test_generate_news.py'
      - 'tools/check-news.py'
      - 'news/**'
      - '.github/workflows/release-gate.yml'
      - '.github/workflows/publish-release.yml'
      - '.github/workflows/publish-news.yml'
  push:
    branches: [main]
    paths:
      - 'release/**'
      - 'tools/prepare-release.py'
      - 'build/ci/prepare-stable-release.py'
      - 'build/ci/ota_v2_product.py'
      - 'build/ci/target_registry.py'
      - 'build/ci/validate-targets.py'
      - 'build/ci/validate-stable-publisher.py'
      - 'build/ci/publish-stable-release.sh'
      - 'build/ci/generate-release-notes.py'
      - 'build/tests/test_release_packaging.py'
      - 'build/tests/test_ota_v2_complete_gate.py'
      - 'build/tests/test_multi_target.py'
      - 'build/tests/test_target_manifest.py'
      - 'build/tests/test_generate_release_notes.py'
      - 'tools/prepare-sbom.py'
      - 'tools/check-release-components.py'
      - 'tools/radio_firmware.py'
      - 'tools/test_radio_firmware.py'
      - 'tools/check-public-metadata.py'
      - 'tools/test_release_tools.py'
      - 'tools/libreecho-install.py'
      - 'tools/libreecho-install.py.sha256'
      - 'tools/run-one-shot.sh'
      - 'tools/test_initial_installer_publication.py'
      - 'tools/test_fastbrick_gate.py'
      - 'tools/test_oneshot_host_preflight.py'
      - 'tools/test_installer_setup_reconnect.py'
      - 'build/ci/release_route.py'
      - 'build/ci/publish_dev_pointer.py'
      - 'build/tests/test_release_route.py'
      - 'build/tests/test_publish_dev_pointer.py'
      - 'build/ci/generate-news.py'
      - 'build/tests/test_generate_news.py'
      - 'tools/check-news.py'
      - 'news/**'
      - '.github/workflows/release-gate.yml'
      - '.github/workflows/publish-release.yml'
      - '.github/workflows/publish-news.yml'
  workflow_dispatch:
    inputs:
      platform_ref:
        description: LibreEcho-Platform branch that provides the target OTA tools
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Validate metadata JSON
        run: |
          python -m json.tool release/components.json >/dev/null
          python -m json.tool release/provenance.schema.json >/dev/null
      - name: Compile release generators
        run: |
          python -m py_compile \
            tools/prepare-release.py \
            build/ci/prepare-stable-release.py \
            build/ci/generate-release-notes.py \
            build/tests/test_release_packaging.py \
            build/tests/test_generate_release_notes.py \
            tools/prepare-sbom.py \
            tools/check-release-components.py \
            tools/radio_firmware.py \
            tools/test_radio_firmware.py \
            tools/check-public-metadata.py \
            tools/test_release_tools.py \
            tools/libreecho-install.py \
            tools/test_initial_installer_publication.py \
            tools/test_fastbrick_gate.py \
            tools/test_oneshot_host_preflight.py \
            tools/test_installer_setup_reconnect.py
      - name: Reject private identifiers in public metadata
        run: python3 tools/check-public-metadata.py
      - name: Enforce full component and SBOM gate
        run: python -m unittest tools.test_release_tools
      - name: Verify the radio firmware publication gate suite
        run: python -B -m unittest tools.test_radio_firmware -v
      - name: Verify commercially unrestricted component gate
        run: |
          python3 tools/check-release-components.py \
            --release-scope commercially-unrestricted

      - name: Verify community noncommercial component gate
        run: |
          python3 tools/check-release-components.py \
            --release-scope community-noncommercial
      - name: Verify build purpose and discovery routing
        run: python -B -m unittest build.tests.test_release_route build.tests.test_publish_dev_pointer -v
      - name: Test the LibreEcho News feed generator and checker
        run: python -B -m unittest build.tests.test_generate_news -v
      - name: Verify public installer mirror
        run: python -B -m unittest tools.test_initial_installer_publication -v
      - name: Verify fastbrick identity and payload gate suite
        run: python -B -m unittest tools.test_fastbrick_gate -v
      - name: Verify host fastboot preflight suite
        run: python -B -m unittest tools.test_oneshot_host_preflight -v
      - name: Verify installer setup reconnect after device reboot
        run: python -B -m unittest tools.test_installer_setup_reconnect -v

  target-contracts:
    name: Target descriptors and multi-target contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Check out Platform target tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/LibreEcho-Platform
          ref: ${{ inputs.platform_ref || 'main' }}
          path: platform-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install reviewed gate dependencies
        run: |
          set -euo pipefail
          wheelhouse="$GITHUB_WORKSPACE/build/inputs/reviewed/python-wheels"
          python -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links "$wheelhouse" \
            --require-hashes \
            --requirement "$wheelhouse/requirements.txt"
      - name: Fetch legacy generator commit for the Radar parity test
        run: |
          set -euo pipefail
          # The multi-target suite compares the current Radar generator with
          # the pinned legacy baseline; the shallow checkout lacks that commit.
          git fetch --no-tags --depth=1 origin c48fe070f38bd2c974257656961918254848758b
          git cat-file -e c48fe070f38bd2c974257656961918254848758b^{commit}
      - name: Validate every target descriptor
        run: |
          set -euo pipefail
          for target in radar_puffin biscuit lidar; do
            python3 build/ci/validate-targets.py --targets "$target"
          done
      - name: Run the target and multi-target contract suites
        env:
          LIBREECHO_PLATFORM_SRC: ${{ github.workspace }}/platform-source
          LIBREECHO_PLATFORM_SOURCE: ${{ github.workspace }}/platform-source
        run: |
          python -B -m unittest -v \
            build.tests.test_multi_target \
            build.tests.test_target_manifest
